<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Inner subtle shine -->
  <rect x="16" y="16" width="480" height="240" rx="96" ry="96" fill="white" opacity="0.08"/>
  <!-- Sound wave bars (centered, 7 bars) -->
  <g transform="translate(256, 256)" fill="url(#wave)">
    <rect x="-120" y="-40" width="20" height="80" rx="10"/>
    <rect x="-80" y="-70" width="20" height="140" rx="10"/>
    <rect x="-40" y="-100" width="20" height="200" rx="10"/>
    <rect x="0" y="-120" width="20" height="240" rx="10" opacity="1"/>
    <rect x="40" y="-100" width="20" height="200" rx="10"/>
    <rect x="80" y="-70" width="20" height="140" rx="10"/>
    <rect x="120" y="-40" width="20" height="80" rx="10"/>
  </g>
</svg>
