[package]
name = "spext"
version = "0.1.0"
description = "Spext — Offline Speech to Text for Desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "spext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
cpal = "0.15"
whisper-rs = "0.14"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
