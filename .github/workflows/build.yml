name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            cmake

      # macOS/Windows cmake
      - name: Install cmake (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install cmake

      - name: Install cmake (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Install frontend dependencies
        working-directory: spext
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: spext
          tagName: ${{ github.ref_name }}
          releaseName: 'Spext ${{ github.ref_name }}'
          releaseBody: 'Offline speech-to-text desktop app'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spext-${{ matrix.name }}
          path: |
            spext/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            spext/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            spext/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            spext/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            spext/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            spext/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
